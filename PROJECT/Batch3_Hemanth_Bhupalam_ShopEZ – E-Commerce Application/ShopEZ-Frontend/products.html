<!DOCTYPE html>
<html>

<head>

    <title>Products - ShopEZ</title>

    <!-- ✅ IMPORTANT FOR RESPONSIVENESS -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="d-flex flex-column min-vh-100">

     <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">ShopEZ</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold nav-custom" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-bold nav-custom" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-bold nav-custom" href="checkout.html">Checkout</a>
                    </li>
                </ul>

                <a href="cart.html" class="btn btn-warning fw-bold">
                    Cart (<span id="cartCount">0</span>)
                </a>

            </div>

        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="flex-grow-1">
        <div class="container mt-3">
              <div id="alertBox"></div>
         </div>

        <!-- SEARCH + FILTER -->
        <div class="container mt-4">

            <div class="row g-3">

                <div class="col-lg-4 col-md-6 col-12">
                    <input type="text" id="searchBox" class="form-control" placeholder="Search products...">
                </div>

                <div class="col-lg-4 col-md-6 col-12">
                    <select id="priceFilter" class="form-select">
                        <option value="all">All Prices</option>
                        <option value="low">Below ₹5000</option>
                        <option value="mid">₹5000 - ₹30000</option>
                        <option value="high">Above ₹30000</option>
                    </select>
                </div>

            </div>

        </div>

        <!-- CATEGORY BUTTONS -->
        <div class="container mt-4 text-center">

            <div class="d-flex flex-wrap justify-content-center">
                <button class="btn btn-outline-primary m-1 category-btn" data-category="all">All</button>
                <button class="btn btn-outline-primary m-1 category-btn" data-category="Electronics">Electronics</button>
                <button class="btn btn-outline-primary m-1 category-btn" data-category="Accessories">Accessories</button>
                <button class="btn btn-outline-primary m-1 category-btn" data-category="Gadgets">Gadgets</button>
                <button class="btn btn-outline-primary m-1 category-btn" data-category="Wearables">Wearables</button>
            </div>

        </div>

        <!-- PRODUCTS -->
        <div class="container mt-5 mb-5">

            <h3 class="text-center mb-4">Products</h3>

            <div class="row g-4" id="productList"></div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-auto bg-dark text-white p-4">
        <div class="container text-center">

            <h4>About ShopEZ</h4>

            <p>
                ShopEZ is a modern e-commerce platform designed to provide a seamless shopping experience.
                We offer quality products, easy navigation, and a user-friendly interface.
            </p>

            <p>© 2026 ShopEZ | All Rights Reserved</p>

        </div>
    </footer>

    <!-- JS -->
    <script src="lib/jquery/jquery.min.js"></script>
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>

</body>

</html>
