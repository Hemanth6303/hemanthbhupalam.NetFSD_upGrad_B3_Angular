<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>
    <!-- ✅ IMPORTANT FOR RESPONSIVENESS -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="d-flex flex-column min-vh-100">

     <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">ShopEZ</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold nav-custom" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-bold nav-custom" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-bold nav-custom" href="checkout.html">Checkout</a>
                    </li>
                </ul>

                <a href="cart.html" class="btn btn-warning fw-bold">
                    Cart (<span id="cartCount">0</span>)
                </a>

            </div>

        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-grow-1">

        <!-- ALERT BOX -->
        <div class="container mt-3">
            <div id="alertBox"></div>
        </div>

        <!-- CHECKOUT -->
        <div class="container mt-5 mb-5">

            <h2 class="text-center mb-4">Checkout</h2>

            <div class="row g-4">

                <!-- ORDER SUMMARY -->
                <div class="col-lg-6 col-md-12">

                    <div class="card fade-in shadow-sm p-3">
                        <h4 class="mb-3">🛒 Order Summary</h4>

                        <ul id="orderSummary" class="list-group mb-3"></ul>

                        <div class="d-flex justify-content-between">
                            <strong>Total:</strong>
                            <strong>₹<span id="orderTotal"></span></strong>
                        </div>

                    </div>

                </div>

                <!-- FORM -->
                <div class="col-lg-6 col-md-12">

                    <div class="card fade-in shadow-sm p-3">

                        <h4 class="mb-3">📦 Shipping Details</h4>

                        <form id="checkoutForm">

                            <input class="form-control mb-3" placeholder="Full Name" required>

                            <input type="email" class="form-control mb-3" placeholder="Email Address" required>

                            <textarea class="form-control mb-3" placeholder="Delivery Address" rows="3" required></textarea>

                            <!-- PAYMENT -->
                            <h5 class="mb-2">💳 Payment Method</h5>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="payment" value="COD">
                                <label class="form-check-label">Cash on Delivery</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="payment" value="UPI">
                                <label class="form-check-label">UPI</label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="payment" value="Card">
                                <label class="form-check-label">Credit / Debit Card</label>
                            </div>

                            <button class="btn btn-success w-100">
                                Place Order
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-auto bg-dark text-white p-4">
        <div class="container text-center">

            <h4>About ShopEZ</h4>

            <p>
                ShopEZ provides a seamless shopping experience with quality products and fast delivery.
            </p>

            <p>© 2026 ShopEZ | All Rights Reserved</p>

        </div>
    </footer>

    <!-- JS -->
    <script src="lib/jquery/jquery.min.js"></script>
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/checkout.js"></script>

</body>

</html>
