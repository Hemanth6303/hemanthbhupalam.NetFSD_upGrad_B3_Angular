<h2>Add Contact</h2>

<form (ngSubmit)="addContact()">
  <input type="number" placeholder="Id" [(ngModel)]="contact.id" name="id"><br>
  <input type="text" placeholder="Name" [(ngModel)]="contact.name" name="name"><br>
  <input type="email" placeholder="Email" [(ngModel)]="contact.email" name="email"><br>
  <input type="text" placeholder="Phone" [(ngModel)]="contact.phone" name="phone"><br>

  <button type="submit">Add</button>
</form>
