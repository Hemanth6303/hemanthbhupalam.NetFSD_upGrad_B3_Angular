<!DOCTYPE html>
<html>
<head>
    <title>Async Task Manager</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 6px 10px;
            margin-left: 5px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            margin: 10px 0;
            background: #f2f2f2;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <h2>📋 Async Task Manager</h2>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button id="addBtn">Add Task</button>

    <ul id="taskList"></ul>

    <script type="module" src="./app.js"></script>

</body>
</html>
