<!DOCTYPE html>
<html>
<head>
    <title>Dynamic To-Do List</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        li {
            display: flex;
            justify-content: space-between;
            background: #f2f2f2;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .completed span {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

    <h2>📝 Dynamic To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button id="addBtn">Add Task</button>

    <ul id="taskList"></ul>

    <script src="app.js"></script>
</body>
</html>
