<!DOCTYPE html>
<html>
<head>
    <title>Feedback Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
           
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            background-color: #45a049;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Feedback Form</h2>
        <p>Click the button below to submit your feedback.</p>

        <button id="submitBtn">Submit Feedback</button>

        <div id="message"></div>
    </div>

    <script>
        // Select elements
        const submitBtn = document.getElementById("submitBtn");
        const messageDiv = document.getElementById("message");

        // Event Listener
        submitBtn.addEventListener("click", () => {

            // Create confirmation message dynamically
            messageDiv.textContent = "✅ Thank you! Your feedback has been submitted successfully.";

        });
    </script>

</body>
</html>
