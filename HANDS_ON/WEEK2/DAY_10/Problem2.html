<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Theme -->
    <style>
        :root {
            --bs-primary: #6f42c1;
            --bs-success: #20c997;
        }

        .hero {
            background: linear-gradient(to right, #6f42c1, #20c997);
            color: white;
            padding: 100px 0;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 30px;
        }

        .product-card img {
            height: 200px;
            object-fit: cover;
        }

        footer {
            background: #212529;
            color: white;
        }
    </style>
</head>
<body>

<!-- ================= NAVBAR WITH OFFCANVAS ================= -->
<nav class="navbar navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">ShopEase</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<!-- Offcanvas Menu -->
<div class="offcanvas offcanvas-end" id="offcanvasMenu">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Offers</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
    </div>
</div>

<!-- ================= HERO SECTION ================= -->
<section class="hero text-center mt-5">
    <div class="container">
        <h1 class="display-4 fw-bold">Welcome to ShopEase</h1>
        <p class="lead">Best Deals on Latest Products</p>
        <button class="btn btn-light btn-lg">Shop Now</button>
    </div>
</section>

<!-- ================= CAROUSEL ================= -->
<div class="container my-5">
    <h2 class="text-center section-title">Featured Products</h2>

    <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/1200/400?random=2" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100">
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
</div>

<!-- ================= PRODUCT GRID ================= -->
<section class="container my-5">
    <h2 class="text-center section-title">Our Products</h2>

    <div class="row g-4">

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card product-card shadow">
                <img src="https://picsum.photos/300/200?random=4" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="text-success fw-bold">₹3,999</p>
                    <button class="btn btn-primary w-100">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card product-card shadow">
                <img src="https://picsum.photos/300/200?random=5" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>
                    <p class="text-success fw-bold">₹1,499</p>
                    <button class="btn btn-primary w-100">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card product-card shadow">
                <img src="https://picsum.photos/300/200?random=6" class="card-img-top">
                <div class="card-body text-center">
                    <h5 class="card-title">Gaming Mouse</h5>
                    <p class="text-success fw-bold">₹899</p>
                    <button class="btn btn-primary w-100">Buy Now</button>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- ================= NEWSLETTER ================= -->
<section class="bg-light py-5">
    <div class="container text-center">
        <h2 class="section-title">Subscribe to Our Newsletter</h2>

        <form class="row justify-content-center">
            <div class="col-md-6 col-12">
                <div class="input-group">
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                    <button class="btn btn-success" type="submit">Subscribe</button>
                </div>
            </div>
        </form>

    </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="text-center py-4">
    <div class="container">
        <p class="mb-0">© 2026 ShopEase | All Rights Reserved</p>
    </div>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
