<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Event Dashboard</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">College Events</a>

        <!-- Toggle Button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible Content -->
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Events</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ================= MAIN DASHBOARD ================= -->
<div class="container my-5">

    <div class="row g-4">

        <!-- Event List Section -->
        <div class="col-12 col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Upcoming Events</h5>
                    <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#addEventModal">
                        + Add Event
                    </button>
                </div>
                <div class="card-body">

                    <div class="list-group">
                        <div class="list-group-item">
                            <h6 class="mb-1">Tech Fest 2026</h6>
                            <small>Date: 10 April 2026</small>
                        </div>
                        <div class="list-group-item">
                            <h6 class="mb-1">Cultural Night</h6>
                            <small>Date: 25 April 2026</small>
                        </div>
                        <div class="list-group-item">
                            <h6 class="mb-1">Sports Meet</h6>
                            <small>Date: 5 May 2026</small>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Registration Form Section -->
        <div class="col-12 col-lg-4">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    Register for Event
                </div>
                <div class="card-body">

                    <form class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" required>
                            <div class="invalid-feedback">
                                Please enter your name.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" required>
                            <div class="invalid-feedback">
                                Enter valid email.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select Event</label>
                            <select class="form-select" required>
                                <option value="">Choose...</option>
                                <option>Tech Fest 2026</option>
                                <option>Cultural Night</option>
                                <option>Sports Meet</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select an event.
                            </div>
                        </div>

                        <button class="btn btn-success w-100" type="submit">
                            Register
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal fade" id="addEventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Add New Event</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form>

                    <div class="mb-3">
                        <label class="form-label">Event Name</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Date</label>
                        <input type="date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Add Event
                    </button>

                </form>

            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (Required for Modal & Navbar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap Validation Script -->
<script>
(() => {
    
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>

</body>
</html>
