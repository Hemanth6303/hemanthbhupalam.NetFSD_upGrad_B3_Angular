<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electronics Store</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- ================= HEADER ================= -->
<div class="bg-dark text-white py-4 text-center">
    <h1 class="fw-bold">ElectroMart</h1>
    <p class="mb-0">Best Deals on Electronics</p>
</div>

<!-- ================= PRODUCT SECTION ================= -->
<div class="container my-5">
    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow">
                <img src="https://picsum.photos/300/200?random=11" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="card-text text-success fw-bold">₹14,999</p>
                    <p class="card-text">Latest Android smartphone with 5G support.</p>
                    <div class="mt-auto">
                        <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-secondary w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow">
                <img src="https://picsum.photos/300/200?random=12" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Laptop</h5>
                    <p class="card-text text-success fw-bold">₹49,999</p>
                    <p class="card-text">High performance laptop for work & gaming.</p>
                    <div class="mt-auto">
                        <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-secondary w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow">
                <img src="https://picsum.photos/300/200?random=13" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Wireless Earbuds</h5>
                    <p class="card-text text-success fw-bold">₹2,499</p>
                    <p class="card-text">Crystal clear sound with noise cancellation.</p>
                    <div class="mt-auto">
                        <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-secondary w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card h-100 shadow">
                <img src="https://picsum.photos/300/200?random=14" class="card-img-top">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="card-text text-success fw-bold">₹3,999</p>
                    <p class="card-text">Track fitness, calls, and notifications.</p>
                    <div class="mt-auto">
                        <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                        <button class="btn btn-outline-secondary w-100">View Details</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
