<!DOCTYPE html>
<html>
<head>
    <title>IndexedDB Expense Tracker</title>
</head>
<body>

<h2>💰 Expense Tracker (IndexedDB)</h2>

<input type="text" id="title" placeholder="Title"><br><br>
<input type="number" id="amount" placeholder="Amount"><br><br>
<input type="date" id="date"><br><br>

<button onclick="addExpense()">Add Expense</button>
<button onclick="viewExpenses()">View Expenses</button>

<h3>Expenses:</h3>
<ul id="expenseList"></ul>

<script>

let db;

// Open Database
let request = indexedDB.open("ExpenseDB", 1);

// Create Object Store (Table)
request.onupgradeneeded = function(event) {
    db = event.target.result;
    db.createObjectStore("expenses", { keyPath: "id", autoIncrement: true });
};

// Success
request.onsuccess = function(event) {
    db = event.target.result;
    console.log("Database opened successfully");
};

// Error
request.onerror = function() {
    console.log("Database error");
};

// Add Expense
function addExpense() {

    let transaction = db.transaction(["expenses"], "readwrite");
    let store = transaction.objectStore("expenses");

    let expense = {
        title: document.getElementById("title").value,
        amount: document.getElementById("amount").value,
        date: document.getElementById("date").value
    };

    store.add(expense);

    transaction.oncomplete = function() {
        alert("Expense Added!");
        viewExpenses();
    };

    transaction.onerror = function() {
        alert("Transaction failed");
    };
}

// View Expenses
function viewExpenses() {

    let list = document.getElementById("expenseList");
    list.innerHTML = "";

    let transaction = db.transaction(["expenses"], "readonly");
    let store = transaction.objectStore("expenses");

    let request = store.openCursor();

    request.onsuccess = function(event) {
        let cursor = event.target.result;

        if (cursor) {

            let item = cursor.value;

            let li = document.createElement("li");
            li.innerHTML =
                item.title + " - ₹" + item.amount +
                " (" + item.date + ") " +
                "<button onclick='deleteExpense(" + item.id + ")'>Delete</button>";

            list.appendChild(li);

            cursor.continue();
        }
    };
}

// Delete Expense
function deleteExpense(id) {

    let transaction = db.transaction(["expenses"], "readwrite");
    let store = transaction.objectStore("expenses");

    store.delete(id);

    transaction.oncomplete = function() {
        alert("Deleted Successfully!");
        viewExpenses();
    };
}

</script>

</body>
</html>
